# SovereignChain development network (single host, localhost ports).
# This is a test harness, NOT a decentralized deployment.
#
# Phase 3 format: node <id> <validator|normal> <ipv4-address> <port> <ed25519_pubkey_hex>
#
# SETUP: Run 'bash scripts/keygen.sh' once to generate keys/ and get the
#        pubkey hex values. Paste the printed 'node ...' lines here.
#
# Until keygen.sh is run, the lines below omit pubkeys (5-field format).
# Nodes will START (with a warning) but will REJECT every peer handshake
# (fail-closed): without a pinned pubkey nobody can be authenticated.
#
# Fixed topology: 2 validators + 4 normal nodes.
node 0 validator 127.0.0.1 9000
node 1 validator 127.0.0.1 9001
node 2 normal    127.0.0.1 9002
node 3 normal    127.0.0.1 9003
node 4 normal    127.0.0.1 9004
node 5 normal    127.0.0.1 9005
